version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: packmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: packmate-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

  user-service:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    container_name: packmate-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mail-service:
        condition: service_started
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=packmate_users_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Services__MailService=http://mail-service:8080

  trip-service:
    build:
      context: .
      dockerfile: TripService/Dockerfile
    container_name: packmate-trip-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=packmate_trips_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Services__WeatherService=http://weather-service:8080
      - Services__TripItemsService=http://trip-items-service:8080
      - Services__AIService=http://ai-service:8080
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}

  trip-items-service:
    build:
      context: .
      dockerfile: TripItemsService/Dockerfile
    container_name: packmate-trip-items-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=packmate_trip_items_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Services__TripService=http://trip-service:8080

  weather-service:
    build:
      context: .
      dockerfile: WeatherService/Dockerfile
    container_name: packmate-weather-service
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - Redis__Configuration=redis:6379
      - Redis__CacheDurationHours=4

  ai-service:
    build:
      context: .
      dockerfile: AIService/Dockerfile
    container_name: packmate-ai-service
    restart: unless-stopped
    environment:
      - AiSettings__BaseUrl=${AI_BASE_URL}
      - AiSettings__ApiKey=${AI_API_KEY}
      - AiSettings__Model=${AI_MODEL}
      - AiSettings__MaxRecommendations=${AI_MAX_RECOMMENDATIONS}

  destination-service:
    build:
      context: .
      dockerfile: DestinationService/Dockerfile
    container_name: packmate-destination-service
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - Redis__Configuration=redis:6379

  mail-service:
    build:
      context: .
      dockerfile: MailService/Dockerfile
    container_name: packmate-mail-service
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - EmailSettings__SenderEmail=${GMAIL_SENDER_EMAIL}
      - EmailSettings__AppPassword=${GMAIL_APP_PASSWORD}
      - EmailSettings__SenderName=${GMAIL_SENDER_NAME}
    ports:
      - "5006:8080"

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    container_name: packmate-api-gateway
    restart: unless-stopped
    ports:
      - "5050:8080"
    depends_on:
      - user-service
      - trip-service
      - trip-items-service
      - weather-service
      - ai-service
      - destination-service
      - mail-service

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: packmate-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: